}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
                             forge_version       : forge_version, forge_version_range: forge_version_range,
                             loader_version_range: loader_version_range,
                             mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
                             mod_authors         : mod_authors, mod_description: mod_description,]

    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes(["Specification-Title"     : mod_id,
                    "Specification-Vendor"    : mod_authors,
                    "Specification-Version"   : "1",
                    "Implementation-Title"    : project.name,
                    "Implementation-Version"  : project.jar.archiveVersion,
                    "Implementation-Vendor"   : mod_authors,
                    "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")])
    }

    finalizedBy 'reobfJar'
}

// jarJar builds the -all jar, which is the artifact that actually gets installed. ForgeGradle creates
// reobfJarJar but does not wire it as a finalizer the way it does for jar, so `gradlew clean jar
// jarJar` happily produces an -all jar still carrying official names: every mixin body would then hit
// NoSuchMethodError in production and every @Shadow would fail to resolve. Make the reobf step
// unskippable instead.
tasks.named('jarJar').configure {
    finalizedBy 'reobfJarJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// The mixin refmap is what maps the Minecraft member names written in our annotations
// (official/mojmap, e.g. "getChunks") onto the SRG names the game actually uses in production
// (e.g. "m_140416_"). collections_of_optimizations.mixins.json declares it by name, but nothing
// makes the jar task fail when it is absent: on an incremental build where compileJava is
// UP-TO-DATE, MixinGradle does not regenerate build/tmp/compileJava/*.refmap.json and the jar is
// silently assembled without it.
//
// The resulting jar loads and looks fine, but at runtime every annotation reference to a
// Minecraft member stays unremapped:
//   - @Invoker / @Accessor / @Shadow throw and take the target class load down with them. This is
//     what crashed Nature's Aura, via a ChunkMap @Invoker that has since been deleted; the live
//     examples are terramity.ClipContextAccessor and terrablender.SurfaceContextAccessor, which are
//     the only two mixins left whose Minecraft member names need remapping.
//   - every @Inject / @At in this project uses require = 0, so those degrade to doing nothing
//     at all, with no log line above DEBUG to say so
//
// So a missing refmap is worse than a build failure. Make it one.
tasks.matching { it.name == 'reobfJar' }.configureEach {
    doLast {
        def jarFile = tasks.named('jar', Jar).get().archiveFile.get().asFile
        def expected = "${mod_id}.refmap.json"
        def present = new java.util.zip.ZipFile(jarFile).withCloseable { zip ->
            zip.getEntry(expected) != null
        }
        if (!present) {
            throw new GradleException(
                    "${expected} is missing from ${jarFile.name}.\n" +
                    "Mixin would run with no name remapping: accessors crash, injections silently " +
                    "no-op.\nRun './gradlew clean jar' to regenerate the refmap.")
        }
        logger.lifecycle("Verified ${expected} is packaged in ${jarFile.name}")
    }
}
